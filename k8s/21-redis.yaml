# The live state of a sale: the queue, admission passes, seat holds and the
# Mission Control counters. All of it is rebuildable — persistence is off on
# purpose, because anything we must never lose is in Postgres instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fairqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "no", "--save", ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fairqueue
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
