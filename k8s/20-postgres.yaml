# The permanent record: orders and tickets, and the UNIQUE(eventId, seatId)
# index that is the last line of defense against selling a seat twice.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: fairqueue
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fairqueue
spec:
  replicas: 1
  # The old pod must release the volume before the new one claims it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: fairqueue
            - name: POSTGRES_DB
              value: fairqueue
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fairqueue-secret
                  key: POSTGRES_PASSWORD
            # The image refuses to initialise onto a volume whose root is not
            # empty, and a mounted volume has a lost+found directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fairqueue", "-d", "fairqueue"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fairqueue", "-d", "fairqueue"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fairqueue
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
